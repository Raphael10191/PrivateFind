services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: privatefind
      MYSQL_USER: privatefind
      MYSQL_PASSWORD: privatefind
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 10

volumes:
  mysql-data:
