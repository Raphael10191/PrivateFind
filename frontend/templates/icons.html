{% macro icon(name) -%}
<svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65"
     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    {% if name == 'home' %}<path d="m3 10 9-7 9 7v10h-6v-6H9v6H3z"/>
    {% elif name == 'search' %}<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>
    {% elif name == 'chevron' %}<path d="m6 9 6 6 6-6"/>
    {% elif name == 'person' %}<circle cx="12" cy="7" r="3.3"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/>
    {% elif name == 'box' %}<rect x="3" y="5" width="18" height="15" rx="2"/><path d="M3 11h18M9 5v6m6-6v6"/>
    {% elif name == 'shield' %}<path d="M12 3 4 6v5c0 5 3 8 8 10 5-2 8-5 8-10V6z"/><path d="m9 12 2 2 4-4"/>
    {% elif name == 'grid' %}<rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/>
    {% elif name == 'activity' %}<path d="M2 12h5l3-7 4 14 3-7h5"/>
    {% elif name == 'list' %}<path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"/>
    {% elif name == 'exit' %}<path d="M12 4H5v16h7M9 12h12m-4-4 4 4-4 4"/>
    {% else %}<path d="M4 12h15m-6-6 6 6-6 6"/>{% endif %}
</svg>
{%- endmacro %}
