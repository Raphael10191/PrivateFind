
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{% block title %}PrivateFind{% endblock %}</title>

    <style>
        :root {
            --background: #FAFAF8;
            --text: #1A1A1F;
            --purple: #6D5BD0;
            --purple-light: #EFEBFA;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--background);
            color: var(--text);
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        a:hover {
            color: var(--purple);
        }

        /* Header */

        .header {
            background: white;
            border-bottom: 1px solid #e8e8e8;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
        }

        .navigation {
            display: flex;
            align-items: center;
            gap: 28px;
        }

        .navigation a.active-link {
            color: var(--purple);
            font-weight: 600;
            border-bottom: 2px solid var(--purple);
            padding-bottom: 6px;
        }

        /* Account dropdown */

        .profile-menu {
            position: relative;
        }

        .profile-menu summary {
            cursor: pointer;
            list-style: none;
            background: var(--purple-light);
            border-radius: 50%;
            padding: 10px 13px;
        }

        .profile-menu summary::-webkit-details-marker {
            display: none;
        }

        .profile-options {
            position: absolute;
            top: 46px;
            right: 0;
            min-width: 150px;
            padding: 14px;
            background: white;
            border: 1px solid #e8e8e8;
            border-radius: 10px;
            box-shadow: 0 8px 24px #00000012;
            z-index: 10;
        }

        .profile-options a {
            display: block;
            padding: 9px;
        }

        .signout-button {
            display: block;
            width: 100%;
            padding: 9px;
            border: 0;
            background: transparent;
            color: inherit;
            text-align: left;
            font: inherit;
            cursor: pointer;
        }

        .signout-button:hover {
            color: var(--purple);
        }

        /* Page content */

        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        /* Authentication visibility */

        .auth-required,
        .guest-only {
            display: none;
        }

        body.auth-owner .navigation .auth-required {
            display: inline-block;
        }

        body.auth-owner .navigation .profile-menu {
            display: block;
        }

        body.auth-guest .navigation .guest-only,
        body.auth-admin .navigation .guest-only {
            display: inline-block;
        }

        /* Mobile navigation */

        .mobile-navigation {
            display: none;
        }

        .mobile-navigation a[aria-current="page"] {
            color: var(--purple);
            font-weight: 700;
        }

        @media (max-width: 600px) {
            .navigation {
                display: none;
            }

            main {
                padding: 24px 16px 90px;
            }

            body.auth-owner .mobile-navigation {
                display: flex;
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                justify-content: space-around;
                padding: 16px;
                background: white;
                border-top: 1px solid #e8e8e8;
                z-index: 20;
            }

            body.auth-guest main,
            body.auth-admin main {
                padding-bottom: 24px;
            }

            body.auth-guest .navigation,
            body.auth-admin .navigation {
                display: flex;
            }
        }
    </style>

    {% block head %}{% endblock %}
</head>

<body>

    <header class="header">
        <a href="/" class="logo">PrivateFind</a>

        <nav class="navigation"
             aria-label="Main navigation">

            <!-- Shown before login -->
            <a href="/login" class="guest-only">
                Sign In
            </a>

            <!-- Shown after Owner login -->
            <a href="/owner"
               class="auth-required
               {% if active_page == 'home' %}
                   active-link
               {% endif %}"
               {% if active_page == 'home' %}
                   aria-current="page"
               {% endif %}>
                Home
            </a>

            <a href="/owner/reports"
               class="auth-required
               {% if active_page == 'reports' %}
                   active-link
               {% endif %}"
               {% if active_page == 'reports' %}
                   aria-current="page"
               {% endif %}>
                My Reports
            </a>

            <details class="profile-menu auth-required">
                <summary aria-label="Account menu">
                    👤
                </summary>

                <div class="profile-options">
                    <a href="/owner/account">
                        My Account
                    </a>

                    <button
                        type="button"
                        class="signout-button"
                        data-signout>
                        Sign out
                    </button>
                </div>
            </details>

        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Mobile Owner navigation -->

    <nav class="mobile-navigation auth-required"
         aria-label="Mobile owner navigation">

        <a href="/owner"
           {% if active_page == 'home' %}
               aria-current="page"
           {% endif %}>
            Home
        </a>

        <a href="/owner/reports"
           {% if active_page == 'reports' %}
               aria-current="page"
           {% endif %}>
            My Reports
        </a>

        <a href="/owner/account"
           {% if active_page == 'account' %}
               aria-current="page"
           {% endif %}>
            Account
        </a>

    </nav>

    <!-- Authentication check -->

    <script>
        document.addEventListener(
            "DOMContentLoaded",
            async () => {

                let user = null;
                let authChecked = false;

                try {
                    const response = await fetch(
                        "/api/auth/me",
                        {
                            credentials: "same-origin",
                            cache: "no-store"
                        }
                    );

                    if (response.ok) {
                        user = await response.json();
                    }

                    authChecked = true;

                } catch (error) {
                    console.error(
                        "Authentication check failed:",
                        error
                    );
                }

                if (authChecked) {
                    if (user && user.role === "owner") {
                        document.body.classList.add(
                            "auth-owner"
                        );
                    } else if (user && user.role === "admin") {
                        document.body.classList.add(
                            "auth-admin"
                        );
                    } else {
                        document.body.classList.add(
                            "auth-guest"
                        );
                    }
                }

                // Sign out using the real backend API.
                document.querySelectorAll(
                    "[data-signout]"
                ).forEach(button => {

                    button.addEventListener(
                        "click",
                        async () => {

                            button.disabled = true;

                            try {
                                const response = await fetch(
                                    "/api/auth/logout",
                                    {
                                        method: "POST",
                                        credentials: "same-origin"
                                    }
                                );

                                if (!response.ok) {
                                    throw new Error(
                                        "Sign out failed"
                                    );
                                }

                                window.location.replace(
                                    "/login"
                                );

                            } catch (error) {
                                alert(
                                    "Could not sign out. Please try again."
                                );

                                button.disabled = false;
                            }
                        }
                    );
                });
            }
        );
    </script>

    {% block scripts %}{% endblock %}

</body>
</html>
