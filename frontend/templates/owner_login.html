
{% extends "base.html" %}

{% block title %}Sign In | PrivateFind{% endblock %}

{% block head %}
<style>
    .login-page {
        max-width: 440px;
        margin: 60px auto;
        padding: 0 16px;
    }

    .login-card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 32px;
    }

    .login-card h1 {
        margin: 0 0 8px;
        font-size: clamp(2.25rem, 5vw, 3.3rem);
    }

    .login-subtitle {
        color: var(--muted);
        font-size: 14px;
        margin-bottom: 28px;
        line-height: 1.5;
    }

    .login-field {
        margin-bottom: 20px;
    }

    .login-field label {
        display: block;
        font-weight: 600;
        font-size: 14px;
        margin-bottom: 8px;
    }

    .login-field input {
        display: block;
        width: 100%;
        padding: 13px;
        border: 1px solid var(--field-border);
        border-radius: 10px;
        background: var(--paper);
        color: var(--ink);
        font: inherit;
    }

    .login-field input:focus {
        outline: 2px solid var(--ink);
        outline-offset: 1px;
    }

    .login-button {
        display: block;
        width: 100%;
        padding: 14px;
        border: 0;
        border-radius: 10px;
        background: var(--ink);
        color: white;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
    }

    .login-button:hover {
        background: var(--green);
    }

    .login-button:disabled {
        opacity: 0.65;
        cursor: wait;
    }

    .login-error {
        margin: 0 0 16px;
        padding: 12px;
        border-radius: 10px;
        background: var(--danger-bg);
        color: var(--danger);
        font-size: 14px;
    }

    .login-error[hidden] {
        display: none;
    }

    .register-link {
        margin: 24px 0 0;
        text-align: center;
        font-size: 14px;
        color: var(--muted);
    }

    .register-link a {
        color: var(--ink);
        font-weight: 600;
    }

    @media (max-width: 600px) {
        .login-page {
            margin: 24px auto;
        }

        .login-card {
            padding: 24px 20px;
        }
    }
</style>
{% endblock %}

{% block content %}
<section class="login-page">
    <div class="login-card">
        <h1>Welcome back</h1>

        <p class="login-subtitle">
            Sign in to your PrivateFind account.
        </p>

        <form id="login-form">
            <div class="login-field">
                <label for="email">Email address</label>
                <input
                    id="email"
                    name="email"
                    type="email"
                    autocomplete="username"
                    placeholder="you@example.com"
                    required
                >
            </div>

            <div class="login-field">
                <label for="password">Password</label>
                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <p id="login-error"
               class="login-error"
               role="alert"
               hidden></p>

            <button id="login-button"
                    class="login-button"
                    type="submit">
                Sign In
            </button>
        </form>

        <p class="register-link">
            Don't have an account?
            <a href="/register">Create an account</a>
        </p>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script>
    const form = document.getElementById("login-form");
    const button = document.getElementById("login-button");
    const errorBox = document.getElementById("login-error");

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        errorBox.hidden = true;
        button.disabled = true;
        button.textContent = "Signing in...";

        try {
            const response = await fetch("/api/auth/login", {
                method: "POST",
                credentials: "same-origin",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    email: form.elements.email.value.trim(),
                    password: form.elements.password.value
                })
            });

            if (!response.ok) {
                let message = "Unable to sign in.";

                try {
                    const data = await response.json();
                    message = data.error?.message || message;
                } catch {
                    // Keep the default message.
                }

                throw new Error(message);
            }

            const user = await response.json();

            if (user.role === "admin") {
                window.location.replace("/admin");
                return;
            }

            if (user.role === "owner") {
                const next = new URLSearchParams(window.location.search).get("next");
                window.location.replace(next === "/owner/report/new" ? next : "/owner");
                return;
            }

            throw new Error("Unsupported account role.");

        } catch (error) {
            errorBox.textContent =
                error.message ||
                "Connection failed. Please try again.";

            errorBox.hidden = false;

        } finally {
            button.disabled = false;
            button.textContent = "Sign In";
        }
    });
</script>
{% endblock %}
